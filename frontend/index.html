<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090d" />
    <title>TurboPix</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Theme FOUC prevention: apply persisted/system theme before first paint.
      (function () {
        var theme = null;
        try {
          theme = JSON.parse(localStorage.getItem('theme'));
        } catch (e) {
          /* ignore */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme + '-theme');
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/DMSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/PlayfairDisplay-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
