# The static ONNX Runtime archive (scripts/fetch-ort.sh) is C++ code. A musl
# release links it into a fully static binary, so its C++ runtime has to be
# static too; `-lgcc` supplies `__cpu_features2`, which musl's libgcc.a owns.
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "link-arg=-static-libstdc++",
    "-C", "link-arg=-static-libgcc",
    "-C", "link-arg=-lgcc",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "link-arg=-static-libstdc++",
    "-C", "link-arg=-static-libgcc",
    "-C", "link-arg=-lgcc",
]
