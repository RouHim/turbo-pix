name: CI/CD
on:
  push:
  pull_request:
  workflow_dispatch: # allow manual execution

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Check frontend format
        run: npm run format:check

      - name: Run Rust linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run frontend linters
        run: npm run lint

      - name: Run i18n integrity check
        run: npm run test:i18n

      - name: Run unit tests
        run: npm run test:unit

  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download AI models
        run: cargo run -- --download-models

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --profile production

  # Dependency advisories. Deliberately non-blocking: a fresh advisory is
  # triaged by a human, and it must never fail an unrelated pull request.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # A step-level `continue-on-error` keeps the CHECK green: an advisory is
      # triaged by a human, and the shape of `rustsec/audit-check` (which fails
      # the job and opens issues) would paint every unrelated PR red.
      - name: Audit Rust dependencies
        continue-on-error: true
        run: cargo audit

      - name: Audit npm dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Optional coverage snapshot for maintainers. Manual dispatches on main only:
  # it never runs on pull_request, and no job lists it in `needs:` — so it can
  # never gate a merge or the release pipeline.
  rust-coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # build.rs embeds dist/ and panics without it.
      - name: Build frontend
        run: npm run build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Rust coverage
        run: npm run coverage:rust

      - name: Upload Rust coverage
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-lcov
          path: target/coverage/lcov.info
          retention-days: 14

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sqlite3

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download AI models
        run: cargo run -- --download-models

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  create-release:
    name: Create release
    needs:
      - lint-format
      - rust-tests
      - e2e-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install Dependencies
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/git \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/commit-analyzer \
            conventional-changelog-conventionalcommits

      - name: Generate Semantic Release Notes and Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-binaries:
    name: Build and upload release binaries
    needs:
      - create-release
      - build-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
            name: turbo-pix-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl
            name: turbo-pix-aarch64-unknown-linux-musl

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Find sqlite3.h include path
        id: sqlite3
        run: |
          cargo fetch --target ${{ matrix.target }}
          SQLITE3_INCLUDE=$(find /root/.cargo -path "*/libsqlite3-sys-*/sqlite3" -type d 2>/dev/null | head -n1)
          echo "include=${SQLITE3_INCLUDE}" >> $GITHUB_OUTPUT

      - name: Build release binary
        env:
          CFLAGS: -I${{ steps.sqlite3.outputs.include }}
        run: cargo build --profile production --target ${{ matrix.target }}

      - name: Rename binary with target name
        run: |
          cp target/${{ matrix.target }}/production/turbo-pix ${{ matrix.name }}

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git ls-remote --tags https://github.com/${{ github.repository }} | grep -o 'refs/tags/[0-9]*\.[0-9]*\.[0-9]*$' | sort -V | tail -n1 | sed 's|refs/tags/||')
          if [ -z "$TAG" ]; then
            echo '::error::No version tags found'
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload binary to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: ${{ matrix.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-container:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    needs:
      - lint-format
      - rust-tests
      - e2e-tests
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build ${{ matrix.arch }} image
        run: |
          podman build \
            --platform ${{ matrix.platform }} \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            --tag turbo-pix-${{ matrix.arch }}:latest \
            -f container/Containerfile .

      - name: Download AI models in container
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p data
          podman run --rm --user=0 -v $(pwd)/data:/data:z turbo-pix-${{ matrix.arch }}:latest --download-models

      - name: Test container startup and health
        if: matrix.arch == 'amd64'
        run: |
          # Host networking: rootless podman's port forward on ubuntu-latest
          # resets connections to the published port even though the server is
          # listening inside the container (verified in run 41978793453). The
          # runner is isolated, so sharing its network namespace is safe.
          podman run -d --name turbo-pix-test --network host --user=0 -v $(pwd)/data:/data:z turbo-pix-${{ matrix.arch }}:latest
          sleep 5
          echo "=== Container logs after 5s ==="
          podman logs turbo-pix-test
          echo "=== Testing health endpoint ==="
          if ! curl --retry 5 --retry-delay 2 --retry-all-errors http://127.0.0.1:18473/health; then
            echo "=== Health check failed, dumping full logs ==="
            podman logs turbo-pix-test
            podman stop turbo-pix-test
            podman rm turbo-pix-test
            exit 1
          fi
          podman stop turbo-pix-test
          podman rm turbo-pix-test

      - name: Push image to Docker Hub
        run: |
          podman push turbo-pix-${{ matrix.arch }}:latest docker.io/rouhim/turbo-pix:${{ matrix.arch }}-latest

  push-manifest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-container

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t docker.io/rouhim/turbo-pix:latest \
            docker.io/rouhim/turbo-pix:amd64-latest \
            docker.io/rouhim/turbo-pix:arm64-latest
