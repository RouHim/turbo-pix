services:
  turbopix:
    build:
      context: .
      dockerfile: container/Containerfile
    ports:
      - "18473:18473"
    volumes:
      - ./data:/data
      # Point this at your own library. The mount must stay WRITABLE: metadata
      # edits, rotation and the scan's in-place faststart rewrite all write
      # into the library (a read-only mount refuses them with 403).
      - ${TURBO_PIX_PHOTO_PATH:-./photos}:/photos
    environment:
      - RUST_LOG=info
      - TURBO_PIX_HOST=0.0.0.0
      # Required for a non-loopback bind: without it the Host header is not
      # pinned and a DNS-rebinding page could reach this unauthenticated API.
      - TURBO_PIX_ALLOWED_HOSTS=${TURBO_PIX_ALLOWED_HOSTS:?set this to the hostname/IP you reach TurboPix on, e.g. 192.168.0.36}
    restart: unless-stopped